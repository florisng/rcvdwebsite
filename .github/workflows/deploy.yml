name: Deploy Node App

on:
  push:
    branches:
      - main
  workflow_dispatch:   # <-- allows manual trigger from Actions tab

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: /var/www/rcvdwebsite

      - name: Install dependencies
        run: |
          cd /var/www/rcvdwebsite
          npm install --production

      - name: Restart app
        run: |
          pm2 reload rcvd
