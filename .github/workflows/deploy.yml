name: Deploy Node.js App to rcvd.rw

on:
  push:
    branches:
      - main  # Trigger deployment on pushes to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 197.243.23.178
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Ensure SSH knows the server
            mkdir -p ~/.ssh
            ssh-keyscan -H 197.243.23.178 >> ~/.ssh/known_hosts

            # Go to app folder
            cd /root/rcvdwebsite

            # Pull latest changes from GitHub
            git reset --hard
            git clean -fd
            git pull origin main

            # Install/update dependencies
            npm install --production

            # Reload the app with PM2
            pm2 reload rcvd

            echo "Deployment complete!"
